<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#282039">
    <title>رحلتنا الصغيرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="journey.css">
  </head>
  <body class="gated">
    <main class="journey" aria-label="رحلتنا سوا">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <header>
        <span class="ticket-mark">هـ ♥ م</span>
        <p>رحلتنا الصغيرة</p>
      </header>

      <section class="route" id="route" aria-label="خط سير القطر">
        <div class="moon" aria-hidden="true"></div>
        <div class="warm" aria-hidden="true"></div>
        <div class="layer far" id="far" aria-hidden="true"></div>
        <div class="layer near" id="near" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>

        <article class="station" data-at="0">
          <div class="station-sign"><span>أول مرة<br>شوفتك</span><small>١٥ أغسطس</small></div>
          <div class="platform"></div><div class="lamp" aria-hidden="true"></div>
        </article>
        <article class="station love-station" data-at="1300">
          <div class="station-sign"><span>هنا بدأ<br>الحب</span><small>٢٨ سبتمبر</small></div>
          <div class="platform"></div><div class="lamp" aria-hidden="true"></div>
        </article>

        <div class="ties" id="ties" aria-hidden="true"></div>
        <div class="rail rail-one" aria-hidden="true"></div><div class="rail rail-two" aria-hidden="true"></div>

        <div class="train" aria-label="قطر ماشي بين المحطات">
          <div class="beam"></div>
          <div class="smoke smoke-one"></div><div class="smoke smoke-two"></div><div class="smoke smoke-three"></div>
          <div class="engine"><i></i><b></b><em></em></div>
          <div class="carriage"><i></i><i></i></div>
          <div class="carriage last"><i></i><i></i></div>
          <div class="wheels"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <p class="forever-message" id="forever" lang="ar" dir="rtl">القطر مش هيقف عشان هفضل بحبك طول عمري</p>
      </section>

      <section class="message" aria-live="polite">
        <p id="journeyMessage">أحلى الرحلات بتبدأ بـ«أهلاً» واحدة.</p>
        <span id="journeyStatus">سايبين محطة أول مرة شوفتك…</span>
      </section>
    </main>
    <div class="gate" id="gate">
      <div class="ticket" id="ticket">
        <div class="ticket-top"><span>تذكرة سفر</span><b>هـ ♥ م</b></div>
        <dl>
          <div><dt>الراكبة</dt><dd>هاجر</dd></div>
          <div><dt>من</dt><dd>أول مرة شوفتك<small>١٥ أغسطس</small></dd></div>
          <div><dt>إلى</dt><dd>سوا للأبد</dd></div>
        </dl>
        <div class="ticket-tear" aria-hidden="true"></div>
        <button class="board" id="boardBtn" type="button">اركبي</button>
        <div class="punch" aria-hidden="true"></div>
        <div class="valid-stamp" aria-hidden="true">صالحة</div>
      </div>
    </div>
    <div class="valid-corner" id="validCorner" aria-hidden="true">صالحة للأبد ♥</div>
    <script src="journey.js"></script>
  </body>
</html>
